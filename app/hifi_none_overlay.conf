# Force generic (non-HiFi intrinsics) audio processing paths for artifact triage.
CONFIG_FILTER_HIFI_NONE=y
CONFIG_VOLUME_HIFI_NONE=y
CONFIG_COMP_STFT_PROCESS_HIFI_NONE=y
CONFIG_MIXIN_MIXOUT_HIFI_NONE=y
CONFIG_DCBLOCK_HIFI_NONE=y
CONFIG_ASRC_HIFI_NONE=y
CONFIG_COPIER_HIFI_NONE=y
CONFIG_DRC_HIFI_NONE=y
CONFIG_ARIA_HIFI_NONE=y
CONFIG_COMP_HIFI_INTRIN_TEST=n
CONFIG_COMPILER_CODEGEN_VLIW_DISABLED=y
CONFIG_XTENSA_HIFI3=n
CONFIG_XTENSA_HIFI4=n
CONFIG_XTENSA_HIFI_SHARING=n

# Keep format conversion on generic path too.
CONFIG_FORMAT_CONVERT_HIFI3=n
CONFIG_PCM_CONVERTER_FORMAT_CONVERT_HIFI3=n

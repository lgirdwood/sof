# Wake-on-Voice modules as LLEXT loadable modules on Intel ACE 3.0
# (PTL/WCL). The board configurations build these platforms statically,
# this overlay brings back the library manager and LLEXT, without
# userspace, and builds the WoV modules as loadable modules.
# Use together with llext_relocatable.conf.

# SOF / loadable modules
CONFIG_LIBRARY_MANAGER=y
CONFIG_LIBRARY_AUTH_SUPPORT=y
CONFIG_LIBRARY_BASE_ADDRESS=0xa0688000
# microWakeWord alone needs about 0.9 MB of the module region
CONFIG_LIBRARY_REGION_SIZE=0x180000
CONFIG_LIBRARY_BUILD_LIB=y

# Zephyr / LLEXT
CONFIG_LLEXT=y
CONFIG_LLEXT_STORAGE_WRITABLE=y
CONFIG_LLEXT_EXPERIMENTAL=y
CONFIG_LLEXT_EDK=n
CONFIG_MODULES=y
CONFIG_XTENSA_MMU_NUM_L2_TABLES=128

# WoV modules
CONFIG_COMP_MIXIN_MIXOUT=m
CONFIG_COMP_ECNS=m
CONFIG_COMP_KPB=m
CONFIG_COMP_MFCC=m
CONFIG_COMP_MWW=m
CONFIG_COMP_WOV_ARBITER=m

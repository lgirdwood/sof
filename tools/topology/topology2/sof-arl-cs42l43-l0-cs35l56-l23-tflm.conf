<host-gateway-src-mfcc-tflm-capture.conf>

Define {
	PLATFORM 			"mtl"
	NUM_SDW_AMP_LINKS 		2
	SDW_DMIC 			1
	NUM_DMICS			2
	SDW_DMIC_ENHANCED_CAPTURE	true
	SDW_AMP_FEEDBACK 		false
	SDW_SPK_STREAM 			Playback-SmartAmp
	SDW_DMIC_STREAM 		Capture-SmartMic
	SDW_JACK_OUT_STREAM 		Playback-SimpleJack
	SDW_JACK_IN_STREAM 		Capture-SimpleJack
	SDW_DMIC_MODULE_COPIER_ID 	41
	TFLM_CAPTURE_PIPELINE_ID 	131
}




<cavs-sdw.conf>

Object.Pipeline.host-gateway-capture [
	{
		index 10

		Object.Widget.host-copier.1 {
			stream_name	"Passthrough Capture 0"
			pcm_id 1
		}

		Object.Widget.tflmcly.1 {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		48000
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

Object.Base.route [
	{
		source "alh-copier.SDW0-Capture.0"
		sink "tflmcly.10.1"
	}
	{
		source "tflmcly.10.1"
		sink "host-copier.1.capture"
	}
]















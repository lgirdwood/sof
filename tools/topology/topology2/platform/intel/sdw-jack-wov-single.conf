# SPDX-License-Identifier: BSD-3-Clause
#
# Single-slot headset WoV path using SoundWire jack capture.
#
# SoundWire jack equalizer output eqiir.11.0 (48 kHz stereo 32-bit) ->
# micsel (stereo -> mono 48kHz 32-bit) ->
# SRC (48kHz -> 16kHz mono 32-bit) ->
# KPB (2000ms 16kHz mono 32-bit) ->
# Detector Copier (32-bit -> 16-bit) ->
# MWW detector slot (MFCC + MicroWakeWord) ->
# 2-pin WOV Arbiter (32-bit audio drain + detector trigger) ->
# Host Copier PCM 14 (D0i3-compatible).
# Load the same hi_intel model blob into the PDM DMIC and headset MWW bytes controls.
#

Class.Pipeline."custom-capture-hs" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  0
	}

	period           1000
	direction        "capture"
	time_domain      "timer"
	dynamic_pipeline 1
}

# ---------------------------------------------------------------------------
# Default parameters
# ---------------------------------------------------------------------------
Define {
	HS_WOV_SOURCE "eqiir.11.0"

	HS_WOV_ARBITER_UUID        "7d:6c:5b:4a:9f:8e:1b:4a:2c:3d:4e:5f:60:71:82:93"

	HS_WOV_PCM_NAME       "Headset WoV"
	HS_WOV_PCM_ID         14
	HS_WOV_PCM_CAPS       "Gain Capture 14"
	HS_WOV_FORMAT         "s16le"

	# Control names for WoV slot 0
	HS_WOV_MFCC_BYTES_NAME "Headset MFCC bytes"
	HS_WOV_MFCC_VAD_NAME   "Headset MFCC VAD"
	HS_WOV_MWW_BYTES_NAME  "Headset MWW bytes"
	HS_WOV_MWW_SCORE_NAME  "Headset MWW Score"
	HS_WOV_PHRASE_DETECT_ID_NAME "Headset Phrase Detect ID"

	HS_WOV_KWD_CPC                 100000
	HS_WOV_ARB_CPC             20000
	HS_WOV_KPB_BUFF_TIME_MS        "2000"

	HS_WOV_SLOT_PIPELINE_ID   112
	HS_WOV_ARB_PIPELINE_ID     115
	HS_WOV_KPB_PIPELINE_ID     117

	HS_WOV_CORE_ID             0
	HS_WOV_MWW_FEATURES                "pcan"
}

IncludeByKey.HS_WOV_MWW_FEATURES {
	"pcan" {
		Define {
			HS_WOV_MFCC_FRAME_BYTES 64
			HS_WOV_MWW_INPUT_BYTES 64
		}
	}
	"agc8" {
		Define {
			HS_WOV_MFCC_FRAME_BYTES 64
			HS_WOV_MWW_INPUT_BYTES 64
		}
	}
}

# ---------------------------------------------------------------------------
# Pipeline 117 — Micsel (stereo -> mono), SRC (48k -> 16k), KPB (Core 0, LL 1ms)
# Splits from the headset capture source. KPB sel_sink feeds module-copier.112.1 and
# host_sink feeds wov-arbiter.115.1, both cross-pipeline.
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture-hs" [
	{
		index      $HS_WOV_KPB_PIPELINE_ID
		format     "s32le"
		rate       16000

		Object.Widget.micsel.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Control {
				bytes."1" {
					name "Headset WoV Micsel bytes"
					<include/components/micsel/downmix_stereo_to_mono.conf>
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            48000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.src.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.kpb.1 {
			history_depth_ms $HS_WOV_KPB_BUFF_TIME_MS
			num_input_pins  1
			num_output_pins 2
			num_input_audio_formats  1
			num_output_audio_formats 2

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 64
				}
			]
			Object.Base.output_audio_format [
				# Pin 0: real-time feed to the detector slots
				{
					output_pin_index    0
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 64
				}
				# Pin 1: drain path to the WOV arbiter and the host PCM
				{
					output_pin_index    1
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 64
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "module-copier.112.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "wov-arbiter.115.1"
			}
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $HS_WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 112 — Headset WoV slot 1 (Core 0, 1ch mono)
# KPB.117.1 sel_sink -> module-copier.112.1 (LL 1ms, 32-bit in -> 16-bit out)
# -> MFCC.112.1 (DP) -> MWW.112.1 (DP) -> wov-arbiter.115.1.
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture-hs" [
	{
		index      $HS_WOV_SLOT_PIPELINE_ID
		format     $HS_WOV_FORMAT
		rate       16000

		Object.Widget.module-copier.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.mfcc.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1
			scheduler_domain "DP"

			Object.Control {
				bytes."1" {
					name $HS_WOV_MFCC_BYTES_NAME
					IncludeByKey.HS_WOV_MWW_FEATURES {
						"pcan"  "include/components/mfcc/mel40_10ms_pcan_compress.conf"
						"agc8"  "include/components/mfcc/mel40_10ms_agc8_compress.conf"
					}
				}
				mixer."1" {
					name $HS_WOV_MFCC_VAD_NAME
					invert "true"
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 320
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 $HS_WOV_MFCC_FRAME_BYTES
				}
			]
		}

		Object.Widget.mww.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1
			scheduler_domain "DP"

			Object.Control {
				bytes."1" {
					name $HS_WOV_MWW_BYTES_NAME
					max 65536
				}
				enum."1" {
					name $HS_WOV_MWW_SCORE_NAME
					<include/components/mww/score_enum.conf>
				}
				mixer."1" {
					name "wovdebug_$index"
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $HS_WOV_MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 $HS_WOV_MWW_INPUT_BYTES
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $HS_WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 115 — WoV Arbiter & Host Copier 14 (Core 0, Mono Output)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture-hs" [
	{
		index      $HS_WOV_ARB_PIPELINE_ID
		format     $HS_WOV_FORMAT
		rate       16000

		Object.Widget.wov-arbiter.1 {
			uuid $HS_WOV_ARBITER_UUID
			num_input_pins  2
			num_output_pins 1
			num_input_audio_formats  2
			num_output_audio_formats 1

			Object.Control.enum."1" {
				name $HS_WOV_PHRASE_DETECT_ID_NAME
			}

			Object.Base.input_pin_binding.1 {
				input_pin_binding_name "kpb.117.1"
			}
			Object.Base.input_pin_binding.2 {
				input_pin_binding_name "mww.112.1"
			}

			Object.Base.input_audio_format [
				# Pin 0: Audio from KPB host_sink (32-bit PCM, 16kHz mono)
				{
					input_pin_index     0
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 64
				}
				# Pin 1: Features from MWW slot 0 (8-bit PCAN, 16kHz mono)
				{
					input_pin_index     1
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $HS_WOV_MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 64
				}
			]
		}

		Object.Widget.host-copier.1 {
			stream_name $HS_WOV_PCM_CAPS
			pcm_id      $HS_WOV_PCM_ID
			node_type   $HDA_HOST_INPUT_CLASS
			direction   "capture"
			type        "aif_out"
			num_input_pins 1

			# IPC4 reads SOF_TKN_STREAM_CAPTURE_COMPATIBLE_D0I3 from the
			# host-copier widget tuples for low-power D0i3 WoV capture across S0iX
			capture_compatible_d0i3 true

			num_input_audio_formats  1
			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]

			num_output_audio_formats 2
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $HS_WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
Object.Base.route [
	# Split the headset capture source into micsel
	{ source $HS_WOV_SOURCE sink "micsel.117.1" }
	{ source "micsel.117.1"                               sink "src.117.1" }
	{ source "src.117.1"                                  sink "kpb.117.1" }

	# KPB Output Pin 0 (16k mono 32-bit) direct to Detector Copier (pipeline 112)
	{ source "kpb.117.1"                                  sink "module-copier.112.1" }

	# Audio path from KPB host_sink (pin 1) to WOV Arbiter audio input (pin 0)
	{ source "kpb.117.1"                                  sink "wov-arbiter.115.1" }

	# Detector slot pipeline 112: copier -> MFCC -> MWW -> WOV Arbiter pin 1
	{ source "module-copier.112.1"                        sink "mfcc.112.1" }
	{ source "mfcc.112.1"                                 sink "mww.112.1" }
	{ source "mww.112.1"                                  sink "wov-arbiter.115.1" }

	# WoV Arbiter output to Host Copier 14
	{ source "wov-arbiter.115.1"                          sink "host-copier.$HS_WOV_PCM_ID.capture" }
]

# ---------------------------------------------------------------------------
# PCM Definitions:
# PCM 14: Headset WoV Arbiter Mono Capture (16 kHz)
# ---------------------------------------------------------------------------
Object.PCM.pcm [
	{
		name    $HS_WOV_PCM_NAME
		id      $HS_WOV_PCM_ID
		direction "capture"
		capture_compatible_d0i3 true

		Object.Base.fe_dai.1 {
			name "$HS_WOV_PCM_CAPS"
		}

		Object.PCM.pcm_caps.1 {
			name       "$HS_WOV_PCM_CAPS"
			formats    "S16_LE,S32_LE"
			rates      "16000"
			channels_min 1
			channels_max 1
		}
	}
]
